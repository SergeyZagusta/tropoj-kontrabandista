<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Тропой контрабандиста</title>
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#0d1108;
  --surface:#171d10;
  --surface-2:#1f2617;
  --surface-3:#29331f;
  --line:#3a4329;
  --line-soft:#252c19;
  --ink:#f2ead6;
  --ink-dim:#a3a988;
  --ink-faint:#6d7358;
  --lamp:#e8b258;
  --lamp-ink:#241a06;
  --lamp-soft:rgba(232,178,88,.16);

  --fx-fixed:#8fbf5e; --fx-fixed-soft:rgba(143,191,94,.16);
  --fx-a:#e0a53f; --fx-a-soft:rgba(224,165,63,.16);
  --fx-b:#6f97c9; --fx-b-soft:rgba(111,151,201,.16);
  --danger:#d9705a; --danger-soft:rgba(217,112,90,.16);

  --crit:#b48ee0; --crit-soft:rgba(180,142,224,.15);
  --counter:#49b3ac; --counter-soft:rgba(73,179,172,.15);
  --magic:#e0699b; --magic-soft:rgba(224,105,155,.15);
  --con:#d1573f; --con-soft:rgba(209,87,63,.15);
  --xp:#f0c56b;

  --radius:16px;
  --font-display:'Big Shoulders Display',sans-serif;
  --font-body:'Manrope',sans-serif;
  --shadow:0 10px 26px -12px rgba(0,0,0,.6);
  --safe-b:env(safe-area-inset-bottom);
  --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#050703;
  color:var(--ink); font-family:var(--font-body); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);margin:0;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }

@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.15);}100%{transform:scale(1);}}
.pop{animation:pop .3s ease;}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
.breathe{animation:breathe 1.7s ease-in-out infinite;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.enter{animation:slideUp .28s ease both;}

/* ===== phone shell ===== */
html,body{height:100%;overflow:hidden;}
#phone{
  max-width:452px;margin:0 auto;height:100vh;height:100dvh;position:relative;
  background:
    radial-gradient(ellipse 500px 320px at 50% 0%, var(--lamp-soft), transparent 60%),
    var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:480px){
  body{display:flex;justify-content:center;padding:28px 12px;}
  #phone{
    height:844px;max-height:900px;border-radius:40px;
    box-shadow:0 40px 80px -24px rgba(0,0,0,.75),0 0 0 8px #000;
    border:2px solid #1b1e14;
  }
}

/* ===== app bar ===== */
.appbar{padding:calc(10px + var(--safe-t)) 16px 8px;flex:0 0 auto;position:relative;z-index:1;}
.appbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.brand{display:flex;align-items:center;gap:8px;min-width:0;}
.brand-mark{width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 4px var(--lamp-soft);flex:0 0 auto;}
.brand-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--surface-2);color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:background .15s,color .15s;
}
.icon-btn:active{transform:scale(.92);}
.icon-btn:disabled{opacity:.32;cursor:not-allowed;}
.icon-btn svg{width:16px;height:16px;}

.progress-strip{display:flex;gap:4px;margin-bottom:8px;}
.progress-seg{flex:1;height:5px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden;}
.progress-seg.done{background:var(--fx-fixed);}
.progress-seg.current{background:var(--surface-3);}
.progress-seg.current::after{content:'';position:absolute;inset:0;background:var(--lamp);width:55%;border-radius:3px;}
.progress-caption{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim);}
.progress-caption b{color:var(--ink);font-weight:700;}
.progress-caption svg{width:14px;height:14px;color:var(--lamp);}

/* ===== tabs ===== */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 12px;position:relative;z-index:1;}
.content.no-actionzone{padding-bottom:24px;}

/* ===== zone card ===== */
.zone-card{
  background:linear-gradient(165deg,var(--surface-2),var(--surface));border:1px solid var(--line-soft);
  border-radius:20px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:12px;
}
.zone-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.zone-glyph{width:46px;height:46px;border-radius:14px;background:var(--surface-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--lamp);flex:0 0 auto;}
.zone-glyph svg{width:22px;height:22px;}
.zone-headtext{min-width:0;}
.zone-name{font-size:20px;font-weight:800;text-transform:uppercase;line-height:1.05;}
.zone-enemy{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin-top:2px;}
.zone-flavor{font-size:13px;color:var(--ink-dim);line-height:1.5;margin:0 0 14px;}

.chip-legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink-faint);margin-bottom:8px;flex-wrap:wrap;}
.chip-legend span{display:inline-flex;align-items:center;gap:4px;}
.legend-dot{width:8px;height:8px;border-radius:2px;}
.req-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.req-die,.grp-chip{width:36px;height:36px;border-radius:24%;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);flex:0 0 auto;}
.req-row .die.ghost{width:36px;height:36px;}
.grp-chip{font-family:var(--font-display);flex-direction:column;border-style:solid;background:var(--surface-3);gap:0;}
.grp-chip .n{font-size:13px;color:var(--ink);}
.grp-chip .x{font-size:6px;color:var(--ink-faint);}

.dice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:6px auto 4px;}
.die{
  width:44px;height:44px;border-radius:24%;background:var(--surface-3);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.3);flex:0 0 auto;
}
.dice-grid .die{width:100%;height:auto;aspect-ratio:1;}
.die svg{width:58%;height:58%;}
.die circle{fill:var(--ink);}
.die.fixed{border-color:var(--fx-fixed);background:var(--fx-fixed-soft);}
.die.fixed circle{fill:var(--fx-fixed);}
.die.group0{border-color:var(--fx-a);background:var(--fx-a-soft);}
.die.group0 circle{fill:var(--fx-a);}
.die.group1{border-color:var(--fx-b);background:var(--fx-b-soft);}
.die.group1 circle{fill:var(--fx-b);}
.die.pickable{cursor:pointer;}
.die.pickable:active{transform:scale(.94);}
.die.picked{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.die.ghost{opacity:.35;border-style:dashed;box-shadow:none;}

.status-pill{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:12.5px;font-weight:700;margin-top:10px;
}
.status-pill.ok{background:var(--fx-fixed-soft);color:var(--fx-fixed);}
.status-pill.fail{background:var(--danger-soft);color:var(--danger);}
.status-pill.info{background:var(--fx-b-soft);color:var(--fx-b);}
.status-pill svg{width:16px;height:16px;flex:0 0 auto;}

/* ===== fixed action zone (above tab bar) ===== */
.actionzone{
  flex:0 0 auto;padding:10px 16px 12px;background:linear-gradient(180deg,transparent,var(--bg) 30%);
  border-top:1px solid var(--line-soft);position:relative;z-index:1;
}
.ability-strip{display:flex;justify-content:center;gap:10px;margin-bottom:10px;}
.ab-badge{
  position:relative;flex:1;max-width:88px;min-height:78px;border-radius:16px;background:var(--surface-2);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:8px 5px;
}
.ab-badge:active:not(:disabled){transform:scale(.94);}
.ab-badge:disabled{opacity:.3;}
.ab-badge svg{width:19px;height:19px;}
.ab-badge .ab-lbl{font-size:9.5px;font-weight:700;text-align:center;line-height:1.15;color:var(--ink-dim);}
.ab-badge .ab-desc{font-size:8px;font-weight:500;text-align:center;line-height:1.2;color:var(--ink-faint);}
.ab-count{
  position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;
  background:var(--lamp);color:var(--lamp-ink);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-body);
}
.az-hint{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);
  border:1.5px solid var(--line-soft);font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:10px;
}
.az-hint svg{width:16px;height:16px;color:var(--lamp);flex:0 0 auto;}
.az-btn-row{display:flex;gap:8px;}
.az-btn{flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:800;cursor:pointer;}
.az-btn:active{transform:scale(.97);}
.az-btn:disabled{opacity:.35;}
.az-btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);}
.az-btn.ghost{background:transparent;color:var(--danger);border-color:var(--danger);}
.cta-btn{
  width:100%;padding:16px;border-radius:16px;border:none;background:var(--lamp);color:var(--lamp-ink);
  font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 0 #a3721f, 0 8px 20px -6px rgba(232,178,88,.4);
}
.cta-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a3721f;}
.cta-btn:disabled{opacity:.35;box-shadow:none;}

/* ===== tab bar ===== */
.tabbar{
  flex:0 0 auto;display:flex;border-top:1px solid var(--line-soft);background:var(--surface);
  padding:6px 8px calc(6px + var(--safe-b));position:relative;z-index:1;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:none;background:none;
  color:var(--ink-faint);cursor:pointer;border-radius:12px;
}
.tab-btn.active{color:var(--lamp);}
.tab-btn svg{width:20px;height:20px;}
.tab-btn span{font-size:10.5px;font-weight:700;}
.tab-badge{
  position:absolute;margin-left:14px;margin-top:-3px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);
  font-size:8.5px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;
}

/* ===== sheet tab content ===== */
.res-card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:14px;margin-bottom:10px;}
.res-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.res-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.res-icon svg{width:17px;height:17px;}
.res-name{font-size:13.5px;font-weight:700;flex:1;}
.res-num{font-family:var(--font-display);font-size:18px;}
.res-desc{font-size:11px;color:var(--ink-faint);margin:0 0 8px;}
.res-bar{display:flex;gap:3px;}
.res-seg{flex:1;height:8px;border-radius:4px;background:var(--surface-3);}
.res-seg.on{background:currentColor;}

.xp-card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:14px;}
.xp-title{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:700;}
.xp-desc{font-size:11.5px;color:var(--ink-faint);line-height:1.45;margin:0 0 12px;}
.xp-row{display:flex;align-items:center;gap:5px;margin-bottom:7px;}
.xp-rn{font-family:var(--font-display);font-size:11px;color:var(--ink-faint);width:15px;}
.xp-dot{flex:1;height:9px;border-radius:5px;background:var(--surface-3);}
.xp-dot.on{background:var(--xp);}
.section-title{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;font-weight:700;}

/* ===== bottom action sheet ===== */
.sheet-backdrop{position:fixed;inset:0;background:rgba(5,7,3,.7);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
.action-sheet{
  width:100%;max-width:452px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + var(--safe-b));
  box-shadow:0 -16px 40px rgba(0,0,0,.5);animation:slideUp .22s ease;
}
.sheet-title{font-size:14px;font-weight:700;margin-bottom:12px;text-align:center;}
.sheet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;}
.sheet-title-row .sheet-title{margin-bottom:0;flex:1;}
.sheet-close-btn{
  width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-2);color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
}
.sheet-close-btn:active{transform:scale(.92);}
.sheet-close-btn svg{width:15px;height:15px;}
.sheet-btn-row{display:flex;gap:10px;margin-bottom:10px;}
.sheet-btn{
  flex:1;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);
  font-size:15px;font-weight:800;cursor:pointer;
}
.sheet-btn:active{transform:scale(.97);}
.sheet-btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);}
.sheet-btn.ghost{background:transparent;color:var(--danger);border-color:var(--danger);}
.sheet-hint{font-size:12px;color:var(--ink-faint);text-align:center;margin-bottom:12px;}
.sheet-dice{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.sheet-dice .die{width:44px;height:44px;}

/* ===== onboarding / setup / end (full screen, no tabbar) ===== */
.full-screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;}
.screen-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 12px;position:relative;z-index:1;}
.screen-footer{flex:0 0 auto;padding:10px 20px calc(14px + var(--safe-b));background:linear-gradient(180deg,transparent,var(--bg) 35%);border-top:1px solid var(--line-soft);position:relative;z-index:1;}

/* ===== animated starfield (every screen, behind #phone content) ===== */
.starfield{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.starfield .star{position:absolute;border-radius:50%;background:var(--ink);box-shadow:0 0 4px 1px rgba(242,234,214,.35);animation-name:star-twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
@keyframes star-twinkle{0%,100%{opacity:.12;}50%{opacity:1;}}
.starfield .star.fixed{animation:none;opacity:.85;}
.eyebrow{font-size:11px;color:var(--ink-faint);letter-spacing:.05em;font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.h-title{font-size:25px;font-weight:800;text-transform:uppercase;line-height:1.1;margin-bottom:12px;}
.p-body{font-size:14px;color:var(--ink-dim);line-height:1.6;margin:0 0 16px;}
.howto-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.howto-item:last-child{border-bottom:none;}
.howto-num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--lamp);color:var(--lamp);background:none;font-family:var(--font-display);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.howto-text b{display:block;font-size:13.5px;margin-bottom:2px;font-weight:700;}
.howto-text span{font-size:12px;color:var(--ink-faint);line-height:1.4;}
.fact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 22px;}
.fact{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;text-align:center;padding:10px 4px;}
.fact b{display:block;font-family:var(--font-display);font-size:19px;color:var(--lamp);}
.fact span{font-size:9px;color:var(--ink-faint);}
.spacer{flex:1;}

.setup-die-grid{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.setup-die-grid .die{width:40px;height:40px;flex:0 0 auto;}
.setup-die-grid .sum-chip{flex:0 0 auto;margin-left:6px;padding-left:10px;border-left:1px solid var(--line-soft);}
.setup-die-grid .icon-btn{flex:0 0 auto;}
.setup-topline{display:none;}
.sum-chip{font-size:10.5px;color:var(--ink-faint);text-align:center;}
.sum-chip b{display:block;font-family:var(--font-display);font-size:18px;color:var(--ink);}
.slot-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.slot-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line-soft);border-radius:14px;background:var(--surface-2);transition:border-color .15s,background .15s;}
.slot-row.filled{opacity:.85;}
.slot-row.drop-hover{border-color:var(--lamp);background:var(--lamp-soft);}
.slot-icon{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.slot-icon svg{width:15px;height:15px;}
.slot-text{flex:1;min-width:0;}
.slot-name{font-size:12.5px;font-weight:700;}
.slot-desc{font-size:10.5px;color:var(--ink-faint);}
.empty-die{width:40px;height:40px;border-radius:24%;border:1.5px dashed var(--line);flex:0 0 auto;}

.ability-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.ability-tile{
  background:var(--surface-2);border:1.5px solid var(--line-soft);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s;
}
.ability-tile.filled{opacity:.85;}
.ability-tile.drop-hover{border-color:var(--lamp);background:var(--lamp-soft);}
.ability-tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.ability-tile-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ability-tile-icon svg{width:15px;height:15px;}
.ability-tile-die{width:36px;height:36px;border-radius:24%;flex:0 0 auto;}
.ability-tile-name{font-size:12.5px;font-weight:700;}
.ability-tile-desc{font-size:10px;color:var(--ink-faint);line-height:1.3;}

.drag-ghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.55);transform:scale(1.08);}
.die.drag-source{opacity:.22;}

.rank-tag{display:block;font-family:var(--font-display);font-size:19px;color:var(--lamp);margin:8px 0 12px;}
.score-line{font-size:12.5px;color:var(--ink-faint);}

.rules-list{}
.rules-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);}
.rules-section:last-child{border:none;}
.rules-section h3{font-size:11px;text-transform:uppercase;color:var(--lamp);letter-spacing:.04em;margin-bottom:5px;font-weight:800;}
.rules-section p{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin:0 0 5px;white-space:pre-line;}
.rules-section ul{margin:5px 0;padding-left:16px;font-size:12px;color:var(--ink-dim);}

/* ===== language screen ===== */
.lang-screen-title{font-size:11px;color:var(--ink-faint);letter-spacing:.05em;font-weight:700;text-transform:uppercase;margin-bottom:8px;text-align:center;}
.lang-screen-list{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
.lang-btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-radius:16px;
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;text-align:left;
}
.lang-btn:active{transform:scale(.98);}
.lang-btn svg{width:18px;height:18px;color:var(--ink-faint);flex:0 0 auto;}
.lang-btn-inner{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;}
.lang-native{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.02em;}

function T(){ return LOCALES[LANG]||LOCALES.ru; }
function ZONES(){ return ZONES_BASE.map((b,i)=>Object.assign({},b,T().zones[i])); }
function SLOT_META(){
  const s=T().slots;
  return {
    crit:Object.assign({icon:'flip',color:'--crit'},s.crit),
    counter:Object.assign({icon:'pm',color:'--counter'},s.counter),
    magic:Object.assign({icon:'moon',color:'--magic'},s.magic),
    con:Object.assign({icon:'heart',color:'--con'},s.con),
    xp:Object.assign({icon:'star',color:'--xp'},s.xp),
    bonfire:Object.assign({icon:'bag',color:'--lamp'},s.bonfire),
  };
}
function RANKS(){ return RANK_THRESHOLDS.map((t,i)=>[t,T().ranks[i]]); }
function RULES(){ return T().rules; }
function LOSE_TEXTS(){ return T().loseTexts; }

function freshState(){
  return {
    phase: LANG?'intro':'lang', tab:'path',
    setupDice:[], assign:{}, selectedDie:null, rerollsLeft:MAX_REROLLS,
    abilities:{crit:{drawn:0,used:0},counter:{drawn:0,used:0},magic:{drawn:0,used:0}},
    con:{drawn:0,used:0},
    xp:Array(13).fill(false), xpRowsAwarded:[false,false,false], pendingBonus:0, afterBonusAction:null,
    bonfireCharges:0, bonfireVisited:false,
    zoneIndex:0, dice:[], zoneStep:0, zoneSolved:false, solveResult:null,
    pendingAction:null, conSelection:[], rulesOpen:false, langSwitchOpen:false, loseTextIdx:null,
  };
}
let S=freshState();
function rollDie(){return 1+Math.floor(Math.random()*6);}
function rollN(n){return Array.from({length:n},rollDie);}
function rowRanges(){return [[0,5],[5,10],[10,13]];}

function trySolve(dice,fixed,groups){
  let avail={1:[],2:[],3:[],4:[],5:[],6:[]};
  dice.forEach((v,i)=>avail[v].push(i));
  let usedFixed=[];
  for(const fv of fixed){ if(avail[fv].length===0) return null; usedFixed.push(avail[fv].pop()); }
  let counts={}; for(let v=1;v<=6;v++) counts[v]=avail[v].length;
  let groupsSorted=groups.map((g,i)=>({g,i})).sort((a,b)=>b.g-a.g);
  let assignment=[];
  function backtrack(k){
    if(k>=groupsSorted.length) return true;
    const need=groupsSorted[k].g;
    for(let v=1;v<=6;v++){
      if(counts[v]>=need){
        counts[v]-=need; assignment.push({value:v,need,groupIdx:groupsSorted[k].i});
        if(backtrack(k+1)) return true;
        assignment.pop(); counts[v]+=need;
      }
    }
    return false;
  }
  if(groupsSorted.length>0){ if(!backtrack(0)) return null; }
  let usedGroups=groups.map(()=>[]);
  for(const a of assignment){ for(let k=0;k<a.need;k++){ usedGroups[a.groupIdx].push(avail[a.value].pop()); } }
  return {usedFixed,usedGroups};
}
function totalCharges(){
  const a=S.abilities;
  return (a.crit.drawn-a.crit.used)+(a.counter.drawn-a.counter.used)+(a.magic.drawn-a.magic.used)+(S.con.drawn-S.con.used);
}
function crossExperience(n){
  for(let k=0;k<n;k++){
    const idx=S.xp.findIndex(v=>!v);
    if(idx===-1) break;
    S.xp[idx]=true;
    checkRowCompletion();
  }
}
function checkRowCompletion(){
  rowRanges().forEach((r,i)=>{
    if(!S.xpRowsAwarded[i]){
      const complete=S.xp.slice(r[0],r[1]).every(v=>v);
      if(complete){ S.xpRowsAwarded[i]=true; S.pendingBonus++; }
    }
  });
}

function selectLanguage(code){ LANG=code; S.phase='intro'; render(); }
function openLangSwitch(){ S.langSwitchOpen=true; render(); }
function closeLangSwitch(){ S.langSwitchOpen=false; render(); }

function beginSetupRoll(){ S.setupDice=rollN(6); S.assign={}; S.selectedDie=null; S.phase='setup'; S.rerollsLeft=MAX_REROLLS; render(); }
function rerollSetup(){
  if(S.rerollsLeft<=0) return;
  S.rerollsLeft--; S.setupDice=rollN(6); S.assign={}; S.selectedDie=null;
  const old=document.getElementById('setup-die-grid');
  if(old && old.isConnected){ old.replaceWith(buildSetupDieGrid()); } else { render(); }
}
function pickDieForAssign(i){ S.selectedDie=(S.selectedDie===i)?null:i; render(); }
function pickSlotForAssign(key){ if(S.assign[key]!==undefined) return; if(S.selectedDie===null) return; S.assign[key]=S.selectedDie; S.selectedDie=null; render(); }
function confirmSetup(){
  if(Object.keys(S.assign).length<6) return;
  S.abilities.crit.drawn=S.setupDice[S.assign.crit];
  S.abilities.counter.drawn=S.setupDice[S.assign.counter];
  S.abilities.magic.drawn=S.setupDice[S.assign.magic];
  S.con.drawn=S.setupDice[S.assign.con];
  S.bonfireCharges=S.setupDice[S.assign.bonfire];
  crossExperience(S.setupDice[S.assign.xp]);
  if(S.pendingBonus>0){ S.phase='award'; S.afterBonusAction='start'; } else { startJourney(); }
  render();
}
function startJourney(){ S.zoneIndex=0; setPhaseForZone(); }
function currentZone(){ return ZONES()[S.zoneIndex]; }
function setPhaseForZone(){
  const z=ZONES()[S.zoneIndex];
  if(z.special){ S.phase='bonfire'; S.bonfireVisited=false; }
  else { S.phase='playing'; S.zoneStep=0; S.dice=[]; S.pendingAction=null; }
}
function rollZone(){ S.dice=rollN(6); crossExperience(S.dice.filter(v=>v===1).length); S.zoneStep=1; evaluateZone(); render(); }
function evaluateZone(){
  const z=currentZone();
  const res=trySolve(S.dice,z.fixed,z.groups);
  S.zoneSolved=!!res; S.solveResult=res;
  if(!S.zoneSolved && totalCharges()<=0){ S.phase='lost'; S.loseTextIdx=Math.floor(Math.random()*LOSE_TEXTS().length); }
}
function startAction(type){ S.pendingAction={type}; S.conSelection=[]; render(); }
function cancelAction(){ S.pendingAction=null; S.conSelection=[]; render(); }
function onDiePickForAction(i){
  const ty=S.pendingAction.type;
  if(ty==='crit') applyCrit(i);
  else if(ty==='magic') applyMagic(i);
  else if(ty==='counter'){ S.pendingAction={type:'counter',dieIdx:i}; render(); }
}
function applyCrit(i){ S.abilities.crit.used++; S.dice[i]=OPPOSITE_FACE[S.dice[i]]; S.pendingAction=null; evaluateZone(); render(); }
function applyCounter(i,d){ const nv=S.dice[i]+d; if(nv<1||nv>6) return; S.abilities.counter.used++; S.dice[i]=nv; S.pendingAction=null; evaluateZone(); render(); }
function applyMagic(i){ S.abilities.magic.used++; S.dice[i]=rollDie(); if(S.dice[i]===1) crossExperience(1); S.pendingAction=null; evaluateZone(); render(); }
function toggleConDie(i){ const idx=S.conSelection.indexOf(i); if(idx>=0) S.conSelection.splice(idx,1); else S.conSelection.push(i); render(); }
function applyCon(){
  if(S.conSelection.length===0) return;
  S.con.used++; let ones=0;
  S.conSelection.forEach(i=>{ S.dice[i]=rollDie(); if(S.dice[i]===1) ones++; });
  if(ones) crossExperience(ones);
  S.pendingAction=null; S.conSelection=[]; evaluateZone(); render();
}
function leaveZone(){ if(S.pendingBonus>0){ S.phase='award'; S.afterBonusAction='advance'; render(); return; } advanceZone(); }
function advanceZone(){ if(S.zoneIndex>=ZONES_BASE.length-1){ S.phase='won'; render(); return; } S.zoneIndex++; setPhaseForZone(); render(); }
function doBonfire(){ if(S.con.drawn<7) S.con.drawn++; crossExperience(S.bonfireCharges); S.bonfireVisited=true; render(); }
function bonfireContinue(){ if(S.pendingBonus>0){ S.phase='award'; S.afterBonusAction='advance'; render(); return; } advanceZone(); }
function awardBonus(key){
  const a=S.abilities[key]; if(a.drawn<7) a.drawn++;
  S.pendingBonus--;
  if(S.pendingBonus>0){ render(); return; }
  if(S.afterBonusAction==='start') startJourney(); else advanceZone();
  render();
}
function resetGame(){ S=freshState(); render(); }
function setTab(t){ S.tab=t; render(); }
function openRules(){ S.rulesOpen=true; render(); }
function closeRules(){ S.rulesOpen=false; render(); }

function el(tag,attrs={},children=[]){
  const n=document.createElement(tag);
  for(const k in attrs){
    const v=attrs[k];
    if(k==='html'){ n.innerHTML=v; }
    else if(k.startsWith('on')&&typeof v==='function'){ n.addEventListener(k.slice(2).toLowerCase(),v); }
    else if(v!==false&&v!==null&&v!==undefined){ n.setAttribute(k,v===true?'':v); }
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    n.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);
  });
  return n;
}

/* ---------- drag & drop for setup dice ---------- */
function findSlotElUnder(x,y){
  const els=document.elementsFromPoint(x,y);
  for(const e of els){ const t=e.closest('[data-slot]'); if(t) return t; }
  return null;
}
function clearDropHighlights(){
  document.querySelectorAll('[data-slot]').forEach(n=>n.classList.remove('drop-hover'));
}
function attachDieDrag(dieWrapEl,i){
  dieWrapEl.style.touchAction='none';
  dieWrapEl.addEventListener('pointerdown',(e)=>{
    if(S.assign[Object.keys(S.assign).find(k=>S.assign[k]===i)]!==undefined){}
    const startX=e.clientX, startY=e.clientY;
    let dragging=false, ghost=null;
    function onMove(ev){
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      if(!dragging && Math.hypot(dx,dy)>7){
        dragging=true;
        ghost=dieEl(S.setupDice[i],{}); ghost.classList.add('drag-ghost');
        ghost.style.width='52px'; ghost.style.height='52px';
        document.body.appendChild(ghost);
        dieWrapEl.classList.add('drag-source');
      }
      if(dragging){
        ghost.style.left=(ev.clientX-26)+'px'; ghost.style.top=(ev.clientY-70)+'px';
        clearDropHighlights();
        const target=findSlotElUnder(ev.clientX, ev.clientY-40);
        if(target && target.dataset.filled!=='1') target.classList.add('drop-hover');
      }
    }
    function onUp(ev){
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
      if(dragging){
        const target=findSlotElUnder(ev.clientX, ev.clientY-40);
        clearDropHighlights();
        if(ghost) ghost.remove();
        if(target && target.dataset.filled!=='1'){
          const key=target.dataset.slot;
          S.assign[key]=i; S.selectedDie=null; render(); return;
        }
        render();
      } else {
        pickDieForAssign(i);
      }
    }
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp,{once:true});
  });
}

  const field=el('div',{class:'starfield'});
  for(let i=0;i<55;i++){
    const size=(Math.random()*1.7+0.6).toFixed(2);
    const top=(Math.random()*100).toFixed(2);
    const left=(Math.random()*100).toFixed(2);
    const dur=(Math.random()*2.6+1.8).toFixed(2);
    const delay=(Math.random()*4).toFixed(2);
    field.appendChild(el('div',{class:'star',style:`width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation-duration:${dur}s;animation-delay:-${delay}s;`}));
  }
  // Big Dipper — same element/size as regular stars, fixed position, no blink.
  DIPPER_PTS.forEach(([left,top])=>{
    field.appendChild(el('div',{class:'star fixed',style:`width:1.3px;height:1.3px;top:${top}%;left:${left}%;`}));
  });
  return field;
}
let STARFIELD_EL=null;
function getStarfield(){
  if(!STARFIELD_EL) STARFIELD_EL=buildStarfield();
  return STARFIELD_EL;
}

function introScreen(){
  const ui=T().ui;
  const p=el('div',{class:'full-screen enter'});
  const scroll=el('div',{class:'screen-scroll'});
  scroll.appendChild(el('div',{class:'eyebrow'},ui.introEyebrow));
  scroll.appendChild(el('h1',{class:'h-title'},ui.introTitle));
  scroll.appendChild(el('p',{class:'p-body'},ui.introBody));
  ui.howto.forEach(([title,desc],i)=>{
    scroll.appendChild(el('div',{class:'howto-item'},[el('div',{class:'howto-num'},String(i+1)),el('div',{class:'howto-text'},[el('b',{},title),el('span',{},desc)])]));
  });
  p.appendChild(scroll);
  p.appendChild(el('div',{class:'screen-footer'},[el('button',{class:'cta-btn',onclick:beginSetupRoll},ui.beginBtn)]));
  return p;
}

function buildSetupDieGrid(){
  const ui=T().ui;
  const sum=S.setupDice.reduce((a,b)=>a+b,0);
  const dieGrid=el('div',{class:'setup-die-grid',id:'setup-die-grid'});
  const dieEls=[];
  S.setupDice.forEach((v,i)=>{
    const assignedTo=Object.keys(S.assign).find(k=>S.assign[k]===i);
    if(assignedTo){ dieGrid.appendChild(el('div',{class:'empty-die',style:'opacity:.2;'})); }
    else{
      const d=dieEl(v,{selectable:true,picked:S.selectedDie===i});
      dieGrid.appendChild(d); dieEls.push([d,i]);
    }
  });
  dieGrid.appendChild(el('div',{class:'sum-chip'},[el('b',{},String(sum)),ui.sumLabel]));
  const allAssigned=Object.keys(S.assign).length===6;
  dieGrid.appendChild(el('button',{class:'icon-btn',disabled:allAssigned||S.rerollsLeft<=0,onclick:rerollSetup,title:ui.rerollTitle(S.rerollsLeft,MAX_REROLLS),html:`<svg viewBox="0 0 24 24">${ICONS.reroll}</svg>`}));
  dieEls.forEach(([d,i])=>attachDieDrag(d,i));
  return dieGrid;
}

function setupScreen(){
  const ui=T().ui; const SM=SLOT_META();
  const p=el('div',{class:'full-screen enter'});
  const scroll=el('div',{class:'screen-scroll'});
  scroll.appendChild(el('div',{class:'eyebrow'},ui.setupEyebrow));
  scroll.appendChild(el('h1',{class:'h-title'},ui.setupTitle));
  scroll.appendChild(el('p',{class:'p-body'},ui.setupBody));
  scroll.appendChild(buildSetupDieGrid());

  scroll.appendChild(el('div',{class:'section-title'},ui.abilitiesSection));
  const abGrid=el('div',{class:'ability-grid'});
  ['crit','counter','magic','con'].forEach(key=>{
    const filled=S.assign[key]!==undefined; const meta=SM[key];
    abGrid.appendChild(el('div',{
      class:'ability-tile'+(filled?' filled':''),'data-slot':key,'data-filled':filled?'1':'0',
      onclick:()=>pickSlotForAssign(key),
    },[
      el('div',{class:'ability-tile-top'},[
        el('div',{class:'ability-tile-icon',style:`background:var(${meta.color}-soft,rgba(255,255,255,.08));color:var(${meta.color});`},[svgIcon(meta.icon)]),
        filled? dieEl(S.setupDice[S.assign[key]],{extraClass:'ability-tile-die'}) : el('div',{class:'empty-die ability-tile-die'}),
      ]),
      el('div',{class:'ability-tile-name'},meta.name),
      el('div',{class:'ability-tile-desc'},meta.desc),
    ]));
  });
  scroll.appendChild(abGrid);

  scroll.appendChild(el('div',{class:'section-title'},ui.xpBonfireSection));
  const list=el('div',{class:'slot-list'});
  ['xp','bonfire'].forEach(key=>{
    const filled=S.assign[key]!==undefined; const meta=SM[key];
    list.appendChild(el('div',{class:'slot-row'+(filled?' filled':''),'data-slot':key,'data-filled':filled?'1':'0',onclick:()=>pickSlotForAssign(key)},[
      el('div',{class:'slot-icon',style:`background:var(${meta.color}-soft,rgba(255,255,255,.08));color:var(${meta.color});`},[svgIcon(meta.icon)]),
      el('div',{class:'slot-text'},[el('div',{class:'slot-name'},meta.name),el('div',{class:'slot-desc'},meta.desc)]),
      filled? dieEl(S.setupDice[S.assign[key]],{}) : el('div',{class:'empty-die'}),
    ]));
  });
  scroll.appendChild(list);
  p.appendChild(scroll);
  const allAssigned=Object.keys(S.assign).length===6;
  p.appendChild(el('div',{class:'screen-footer'},[el('button',{class:'cta-btn',disabled:!allAssigned,onclick:confirmSetup},ui.startRouteBtn)]));

  return p;
}

function endScreen(){
  const ui=T().ui;
  const p=el('div',{class:'full-screen enter'});
  const scroll=el('div',{class:'screen-scroll'});
  const won=S.phase==='won';
  if(won){
    const score=S.abilities.crit.used+S.abilities.counter.used+S.abilities.magic.used+S.con.used;
    const rank=RANKS().find(r=>score<=r[0])[1];
    scroll.appendChild(el('div',{class:'eyebrow'},ui.wonEyebrow));
    scroll.appendChild(el('h1',{class:'h-title'},ui.wonTitle));
    scroll.appendChild(el('p',{class:'p-body'},ui.wonBody));
    scroll.appendChild(el('span',{class:'rank-tag'},rank));
    scroll.appendChild(el('div',{class:'score-line'},ui.scoreLine(score)));
  } else {
    const t=LOSE_TEXTS()[S.loseTextIdx??0];
    scroll.appendChild(el('div',{class:'eyebrow'},ui.lostEyebrow));
    scroll.appendChild(el('h1',{class:'h-title'},t.title));
    scroll.appendChild(el('p',{class:'p-body'},t.body.replace('{zone}',currentZone().name)));
  }
  p.appendChild(scroll);
  p.appendChild(el('div',{class:'screen-footer'},[el('button',{class:'cta-btn',onclick:resetGame},ui.newRunBtn)]));
  return p;
}

function rulesSheet(){
  const ui=T().ui;
  const backdrop=el('div',{class:'sheet-backdrop',onclick:(e)=>{ if(e.target===backdrop) closeRules(); }});
  const sheet=el('div',{class:'action-sheet',style:'max-height:78vh;overflow-y:auto;text-align:left;'});
  sheet.appendChild(el('div',{class:'sheet-title-row'},[
    el('div',{class:'sheet-title',style:'text-align:left;font-size:17px;'},ui.rulesTitle),
    el('button',{class:'sheet-close-btn',onclick:closeRules,'aria-label':ui.closeAria},[svgIcon('close')]),
  ]));
  RULES().forEach(sec=>{
    const s=el('div',{class:'rules-section'});
    if(sec.title) s.appendChild(el('h3',{},sec.title));
    if(sec.body) sec.body.split('\n').forEach(t=>s.appendChild(el('p',{},t)));
    if(sec.list){ const ul=el('ul',{}); sec.list.forEach(li=>ul.appendChild(el('li',{},li))); s.appendChild(ul); }
    if(sec.note) s.appendChild(el('p',{style:'font-style:italic;color:var(--ink-faint);'},sec.note));
    sheet.appendChild(s);
  });
  sheet.appendChild(el('button',{class:'sheet-btn primary',style:'margin-top:8px;',onclick:closeRules},ui.understoodBtn));
  backdrop.appendChild(sheet);
  return backdrop;
}

function render(){
  const app=document.getElementById('phone');
  app.innerHTML='';
  app.appendChild(getStarfield());
  if(LANG){ document.title=T().appName; document.documentElement.lang=LANG; }

  if(S.phase==='lang'){ app.appendChild(langScreen()); return; }

  app.appendChild(appBar());

  if(S.phase==='intro'){ app.appendChild(introScreen()); if(S.rulesOpen) app.appendChild(rulesSheet()); if(S.langSwitchOpen) app.appendChild(langSwitchSheet()); return; }
  if(S.phase==='setup'){ app.appendChild(setupScreen()); if(S.rulesOpen) app.appendChild(rulesSheet()); if(S.langSwitchOpen) app.appendChild(langSwitchSheet()); return; }
  if(S.phase==='won'||S.phase==='lost'){ app.appendChild(endScreen()); if(S.rulesOpen) app.appendChild(rulesSheet()); if(S.langSwitchOpen) app.appendChild(langSwitchSheet()); return; }

  const content=el('div',{class:'content'});
  content.appendChild(S.tab==='path'?pathContent():sheetTabContent());
  app.appendChild(content);
  if(S.tab==='path'){ const az=actionZone(); if(az) app.appendChild(az); }
  app.appendChild(tabBar());
  if(S.rulesOpen) app.appendChild(rulesSheet());
  if(S.langSwitchOpen) app.appendChild(langSwitchSheet());
}
render();
</script>
</body>
